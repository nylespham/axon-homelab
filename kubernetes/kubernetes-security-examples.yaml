# Kubernetes Security Baseline
# Fixed version of the provided examples. See docs/FINDINGS.md for what was
# wrong with the originals and why each change was made.
#
# Requires: VPC CNI network policy enforcement (enableNetworkPolicy=true,
# set in terraform/eks.tf). Without it EKS silently ignores NetworkPolicies.
#
# Apply: kubectl apply -f kubernetes/kubernetes-security-examples.yaml

---
# Namespaces with Pod Security Admission (PodSecurityPolicy was removed in
# Kubernetes 1.25; the provided PSP example no longer applies)
apiVersion: v1
kind: Namespace
metadata:
  name: vulnerable-app
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Default deny for both namespaces. NetworkPolicies are additive, so the
# allow rules below open only what is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: vulnerable-app
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: database
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
# DNS for every pod in both namespaces. The provided examples denied all
# egress (or only allowed 5432), which breaks name resolution.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: vulnerable-app
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: database
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }

---
# App: ingress only from the ALB (public subnets, IP target mode), egress
# only to Postgres.
# - The original selected namespaces by a "name" label, which Kubernetes
#   never sets; kubernetes.io/metadata.name is set automatically.
# - The original allowed ingress from a "waf" namespace. With AWS WAF on an
#   ALB, traffic arrives from the ALB's IPs in the public subnets, not from
#   pods, so the rule has to be an ipBlock.
# - The original allowed egress to 80/443 anywhere: an open exfiltration path
#   for a known-vulnerable app. The app doesn't need it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-network-policy
  namespace: vulnerable-app
spec:
  podSelector:
    matchLabels:
      app: vulnerable-flask
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.20.101.0/24 }   # public subnet AZ a (terraform/vpc.tf)
        - ipBlock: { cidr: 10.20.102.0/24 }   # public subnet AZ b
      ports:
        - { protocol: TCP, port: 5000 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - { protocol: TCP, port: 5432 }

# Postgres ingress is restricted by the Helm chart's own NetworkPolicy
# (database/postgres-values.yaml: primary.networkPolicy). The provided
# database policy also selected pods by "app: postgres", a label the Bitnami
# chart doesn't use, so it matched nothing.

---
# Service account with no API token. The provided example also bound a Role
# granting "get secrets" and "list pods": the app never calls the Kubernetes
# API, so it gets no Role at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: vulnerable-app
automountServiceAccountToken: false

---
# Pod Disruption Budget. With minAvailable: 1 and a single replica (the
# original), no voluntary eviction is ever allowed, so node drains and
# upgrades hang. maxUnavailable: 1 keeps drains working; run 2+ replicas for
# real availability.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-pdb
  namespace: vulnerable-app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: vulnerable-flask

---
# Resource quota and default limits, so a pod without limits can't exhaust
# a small node (t3.small: 2 vCPU, 2 GiB)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-resource-quota
  namespace: vulnerable-app
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    services.loadbalancers: "0"   # exposure goes through the ALB Ingress only
    services.nodeports: "0"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: app-default-limits
  namespace: vulnerable-app
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 256Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
