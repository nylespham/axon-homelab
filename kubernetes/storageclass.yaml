# Encrypted gp3 StorageClass for the PostgreSQL volume.
# Requires the aws-ebs-csi-driver EKS add-on (terraform/eks.tf). Without it,
# EKS has no working provisioner and the Postgres PVC stays Pending.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3-encrypted
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
