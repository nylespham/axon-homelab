# NOTE (homelab): REFERENCE ONLY — not applied in this lab. It would expose
# the deliberately-vulnerable app on a public internet-facing ALB (billable),
# so it is intentionally left undeployed. It documents how the WAF
# (terraform/waf.tf) would be attached in a real environment. Access the app
# via `kubectl port-forward` instead (README step 4).
#
# Public ALB for the app, created by the AWS Load Balancer Controller, with
# the WAFv2 web ACL attached (terraform/waf.tf).
#
# NOT in kustomization.yaml by default: the WAF ARN below is generated by
# Terraform, so set it first, then apply this file on its own:
#   ARN=$(cd terraform && terraform output -raw waf_web_acl_arn)
#   sed "s#__WAF_ACL_ARN__#$ARN#" kubernetes/app/ingress.yaml | kubectl apply -f -
#
# Prerequisites: AWS Load Balancer Controller installed (kubernetes/app/README.md),
# public subnets tagged kubernetes.io/role/elb=1 (terraform/vpc.tf).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vulnerable-flask
  namespace: vulnerable-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Send traffic straight to pod IPs (the app NetworkPolicy allows the
    # public-subnet CIDRs the ALB ENIs sit in)
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # The whole point: inspect every request through the WAF
    alb.ingress.kubernetes.io/wafv2-acl-arn: __WAF_ACL_ARN__
    # Drop idle connections; keeps the ALB from holding slow-loris sockets
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
    # Send ALB access logs to S3 as well (set your bucket), optional:
    # alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=<bucket>
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vulnerable-flask
                port:
                  number: 80
